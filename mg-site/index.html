      }

    <!-- Content-Security-Policy (CSP): -->
    <!--
    CSP notes:
    - script-src uses hashes for the two inline scripts below instead of 'unsafe-inline'.
      If you change whitespace inside either <script> block, recompute the hashes:
        python3 -c "import hashlib,base64; print('sha256-'+base64.b64encode(hashlib.sha256(open('index.html').read().encode()).digest()).decode())"
      Or use: https://csp-evaluator.withgoogle.com/
    - The two hashes below correspond exactly to the inline scripts in this file.
      Hash 1 (HTTPS redirect): sha256-L1FLYzOzkG54VzfnOuU1/OLC4dAfj8P8FRJ9l3zXo0U=
      Hash 2 (GTM init):       sha256-Rs86ePUAEMrfxiNiqkn6au8fI9GVq5av2O54m9EJ5+U=
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
            script-src 'self'
              https://www.googletagmanager.com
              'sha256-N6mjn6TMdNUYnKJWgvjlH6m9z/DDsVq8D2jJ8L27NXg='
              'sha256-Rs86ePUAEMrfxiNiqkn6au8fI9GVq5av2O54m9EJ5+U=';

              https://www.googletagmanager.com
              https://docs.google.com
              https://api.emailjs.com;
            img-src 'self' https://purecatamphetamine.github.io data:;
            style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
            font-src 'self' https://fonts.gstatic.com;
            frame-src 'none';
            object-src 'none';
            base-uri 'self';
            form-action 'self' https://docs.google.com;
            manifest-src 'self';
            worker-src 'none';
            upgrade-insecure-requests;"
